StylesPath = .github/vale/styles
MinAlertLevel = suggestion

Vocab = Uniswap

# Documentation files
[docs/**/*.md]
BasedOnStyles = Vale

# Ignore code blocks and inline code
TokenIgnores = (`.*?`)

# Disable term consistency checks in docs
Vale.Terms = NO

# Both sections below must stay AFTER [docs/**/*.md]: when several sections
# match a file, the last one wins and an empty BasedOnStyles clears what the
# earlier section set. Moving either one up silently re-enables linting.

# docs/api is TypeDoc output, auto-generated and auto-committed by
# generate-docs.yml. Its prose is type and parameter names, so spell-checking it
# would fail the build on content no one wrote by hand.
[docs/api/**/*.md]
BasedOnStyles =

# docs/proposals is gitignored for local drafts. Vale walks the filesystem
# rather than the git index, so without this a developer's unstaged draft fails
# `bun run docs:lint` on a finding CI can never see.
[docs/proposals/**/*.md]
BasedOnStyles =
